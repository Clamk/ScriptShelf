<!DOCTYPE html>
<!--
  PDF PAGE EXTRACTOR
  ------------------
  What it does : Load a PDF, pick pages, save each picked page as its own PDF.
  How to use   : 1. Save this text as  pdf-extractor.html
                 2. Double-click it (opens in your browser)
                 3. Choose a PDF, click thumbnails (or type a range like 1-3, 7), press Save.
  Privacy      : Everything happens on your computer. Nothing is uploaded.
  Libraries    : pdf.js  (draws page previews)   - Mozilla
                 pdf-lib (cuts pages into PDFs)  - open source
                 Both are loaded from the internet when the page opens.
  Output names : <original name>_page-001.pdf, _page-002.pdf, ...
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Page Extractor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  button { padding: 7px 14px; border: 1px solid #aaa; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover:not(:disabled) { background: #eef; }
  button.primary { background: #2a62d6; color: #fff; border-color: #2a62d6; }
  button.primary:hover:not(:disabled) { background: #1f4fb0; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { padding: 7px 10px; border: 1px solid #aaa; border-radius: 6px; width: 260px; font-size: 14px; }
  #status { font-size: 13px; color: #555; }
  #status.error { color: #b00020; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 20px 24px; }
  .card { background: #fff; border: 3px solid transparent; border-radius: 8px; padding: 8px; text-align: center;
          cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); min-height: 180px; }
  .card.selected { border-color: #2a62d6; background: #eaf0ff; }
  .card canvas { max-width: 100%; height: auto; display: block; margin: 0 auto 6px; }
  .card span { font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>PDF Page Extractor</h1>
  <div class="row">
    <input type="file" id="file" accept="application/pdf">
    <span id="status">Choose a PDF to begin.</span>
  </div>
  <div class="row">
    <label>Pages:
      <input type="text" id="range" placeholder="e.g. 1-3, 7, 10-12" disabled>
    </label>
    <button id="all" disabled>Select all</button>
    <button id="none" disabled>Clear</button>
    <button id="save" class="primary" disabled>Save selected pages as separate PDFs</button>
  </div>
</header>
<div id="grid"></div>

<script>
// ---------- Setup ----------
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const state = { bytes: null, baseName: "document", numPages: 0, selected: new Set() };

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}

// ---------- Page-range text <-> selection ----------
// "1-3, 7" -> Set{1,2,3,7}. Returns null if the text is invalid.
function parseRange(text) {
  const result = new Set();
  if (!text.trim()) return result;
  for (const part of text.split(",")) {
    const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if (!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a;
    if (a < 1 || b < a || b > state.numPages) return null;
    for (let i = a; i <= b; i++) result.add(i);
  }
  return result;
}

// Set{1,2,3,7} -> "1-3, 7"
function formatRange(set) {
  const nums = [...set].sort((a, b) => a - b);
  const parts = [];
  for (let i = 0; i < nums.length; ) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    parts.push(j > i ? `${nums[i]}-${nums[j]}` : `${nums[i]}`);
    i = j + 1;
  }
  return parts.join(", ");
}

// ---------- Keep screen in sync with selection ----------
function refreshUI({ updateTextBox = true } = {}) {
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("selected", state.selected.has(+c.dataset.page)));
  if (updateTextBox) $("range").value = formatRange(state.selected);
  $("save").disabled = state.selected.size === 0;
  setStatus(`${state.numPages} pages loaded. ${state.selected.size} selected.`);
}

// ---------- Loading a PDF ----------
$("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  setStatus("Loading…");
  try {
    state.bytes = await file.arrayBuffer();
    state.baseName = file.name.replace(/\.pdf$/i, "");
    state.selected.clear();
    // pdf.js takes ownership of the data it is given, so hand it a copy.
    const doc = await pdfjsLib.getDocument({ data: state.bytes.slice(0) }).promise;
    state.numPages = doc.numPages;
    buildGrid(doc);
    ["range", "all", "none"].forEach(id => $(id).disabled = false);
    refreshUI();
  } catch (err) {
    setStatus("Could not open this PDF: " + err.message, true);
  }
});

// Create one card per page; draw each preview only when it scrolls into view.
function buildGrid(doc) {
  const grid = $("grid");
  grid.innerHTML = "";
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);
      drawThumbnail(doc, entry.target);
    }
  }, { rootMargin: "300px" });

  for (let n = 1; n <= doc.numPages; n++) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.page = n;
    card.innerHTML = `<span>Page ${n}</span>`;
    card.addEventListener("click", () => {
      state.selected.has(n) ? state.selected.delete(n) : state.selected.add(n);
      refreshUI();
    });
    grid.appendChild(card);
    observer.observe(card);
  }
}

async function drawThumbnail(doc, card) {
  const page = await doc.getPage(+card.dataset.page);
  const viewport = page.getViewport({ scale: 0.4 });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  card.insertBefore(canvas, card.firstChild);
}

// ---------- Selection controls ----------
$("range").addEventListener("input", e => {
  const parsed = parseRange(e.target.value);
  if (parsed === null) { setStatus(`Not understood. Use e.g. 1-3, 7 (pages 1 to ${state.numPages}).`, true); return; }
  state.selected = parsed;
  refreshUI({ updateTextBox: false });
});
$("all").addEventListener("click", () => {
  state.selected = new Set(Array.from({ length: state.numPages }, (_, i) => i + 1));
  refreshUI();
});
$("none").addEventListener("click", () => { state.selected.clear(); refreshUI(); });

// ---------- Saving ----------
$("save").addEventListener("click", async () => {
  const pages = [...state.selected].sort((a, b) => a - b);
  const digits = String(state.numPages).length;
  $("save").disabled = true;
  try {
    const source = await PDFLib.PDFDocument.load(state.bytes);
    for (let i = 0; i < pages.length; i++) {
      setStatus(`Saving ${i + 1} of ${pages.length}…`);
      const out = await PDFLib.PDFDocument.create();
      const [copied] = await out.copyPages(source, [pages[i] - 1]);
      out.addPage(copied);
      const blob = new Blob([await out.save()], { type: "application/pdf" });
      const name = `${state.baseName}_page-${String(pages[i]).padStart(digits, "0")}.pdf`;
      download(blob, name);
      await new Promise(r => setTimeout(r, 250)); // small pause so browsers accept many downloads
    }
    refreshUI();
    setStatus(`Done: ${pages.length} file(s) saved to your Downloads folder.`);
  } catch (err) {
    setStatus("Saving failed: " + err.message + " (password-protected PDFs are not supported)", true);
  }
  $("save").disabled = state.selected.size === 0;
});

function download(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
</script>
</body>
</html>
